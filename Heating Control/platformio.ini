[env:controller_w]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file
upload_port = COM5
monitor_port = COM5
build_src_filter = +<w_controller/*>
; ONEWIRE_CRC16=0: disables OneWire's crc16() method which references _crc16_update
; from avr-libc but ModbusMaster's src/util/crc16.h shadows that header. DallasTemperature
; only uses CRC8 so this is safe.
build_flags = -DONEWIRE_CRC16=0
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit INA219@^1.2.1
    4-20ma/ModbusMaster@^2.0.1

[env:controller_h]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file
upload_port = COM4
monitor_port = COM4
build_src_filter = +<h_controller/*>
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=128
    -Wl,-u,vfprintf,-lprintf_flt,-lm
    -DUSER_SETUP_LOADED
    -DILI9488_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=51
    -DTFT_SCLK=52
    -DTFT_MISO=50
    -DTFT_CS=53
    -DTFT_DC=49
    -DTFT_RST=47
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=8000000
    -DSPI_READ_FREQUENCY=4000000
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit GFX Library@^1.11.9
    arduino-libraries/SD@^1.2.4
    adafruit/RTClib@^2.1.4

